<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="180" fill="url(#eqGrad)" opacity="0.18" />
  
  <!-- Outer Equilibrium Shield Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#eqGrad)" stroke-width="14" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Brand Icon Body: Dynamic Balance Core -->
  <g filter="url(#shadow)">
    <!-- Central Pulse Wave & Human Movement Silhouette -->
    <path d="M120 256 H190 L220 180 L260 332 L295 220 L320 256 H392" 
          fill="none" 
          stroke="url(#eqGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="256" cy="135" r="28" fill="#38BDF8" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="420" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="4">EQUILIBRA</text>
</svg>
