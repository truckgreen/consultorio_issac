<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Servicio en mantenimiento</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b1220 0%, #10243a 100%);
      color: #e6f0ff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .container { text-align: center; padding: 2rem; }

    .message {
      font-size: clamp(1.5rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.05;
      animation: pulse 2.4s ease-in-out infinite;
      text-shadow: 0 6px 18px rgba(2,6,23,0.6);
    }

    .sub {
      margin-top: 0.75rem;
      font-size: clamp(0.9rem, 2.5vw, 1.15rem);
      opacity: 0.9;
      animation: float 3.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.985); opacity: 0.88; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.985); opacity: 0.88; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Ensure no interactive elements are visible */
    a, button, input, select, textarea { display: none !important; }
  </style>
</head>
<body>
  <div class="container" role="status" aria-live="polite">
    <div class="message">Servicio en mantenimiento</div>
    <div class="sub">por inactividad</div>
  </div>
</body>
</html>
