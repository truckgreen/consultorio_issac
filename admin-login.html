<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EQUILIBRA | Acceso Administrador</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        padding: 20px;
      }
      .login-container {
        width: min(440px, 100%);
        background: #ffffff;
        border-radius: var(--radius-2xl);
        padding: 40px 32px;
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
        border: 1px solid var(--border-light);
      }
      .login-header {
        text-align: center;
        margin-bottom: 26px;
      }
      .login-header h1 {
        font-size: 1.8rem;
        color: var(--slate-900);
        margin: 12px 0 6px;
      }
      .login-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <!-- Contenedor Global de Notificaciones Toast -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <div class="login-container">
      <div class="login-header">
        <div style="display: flex; justify-content: center; margin-bottom: 12px;">
          <div class="brand-mark">E</div>
        </div>
        <h1>Acceso Administrativo</h1>
        <p>Ingresa tus credenciales para gestionar citas y tarifas.</p>
      </div>

      <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-field">
          <label for="adminUsername" style="font-weight: 700; font-size: 0.85rem; color: var(--text-muted);">Usuario</label>
          <input type="text" id="adminUsername" value="admin" style="padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-light); font-size: 0.95rem;" required />
        </div>

        <div class="form-field">
          <label for="adminPassword" style="font-weight: 700; font-size: 0.85rem; color: var(--text-muted);">Contraseña</label>
          <input type="password" id="adminPassword" placeholder="••••••••" style="padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-light); font-size: 0.95rem;" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; margin-top: 8px;">
          Entrar al Panel
        </button>
      </form>

      <div style="text-align: center; margin-top: 22px;">
        <a href="index.html" style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">
          ← Volver al sitio web principal
        </a>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      const loginForm = document.getElementById('adminLoginForm');
      const passwordInput = document.getElementById('adminPassword');
      const usernameInput = document.getElementById('adminUsername');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.message || 'Credenciales inválidas');
          }

          localStorage.setItem('equilibra_admin_token', data.token);
          showToast('¡Bienvenido al panel administrativo!', 'success');
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 600);
        } catch (err) {
          // Fallback para contraseña por defecto 'equilibra123'
          if (password === 'equilibra123') {
            localStorage.setItem('equilibra_admin_token', 'local-admin-auth');
            showToast('¡Acceso concedido!', 'success');
            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 600);
            return;
          }

          showToast(err.message || 'Contraseña incorrecta. Intenta de nuevo.', 'error');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    </script>
  </body>
</html>
