<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EQUILIBRA | Login Admin</title>
    <style>
      :root {
        --yellow: #f1c40f;
        --yellow-deep: #d8a800;
        --bg: #f7f4ef;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #5f5f5f;
        --line: rgba(18,18,18,0.08);
        --shadow: 0 20px 45px rgba(20, 20, 20, 0.10);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7f2e7, #eef2f4);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      .login-shell {
        width: min(440px, calc(100% - 32px));
      }

      .login-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 28px 24px 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 18px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--yellow), var(--yellow-deep));
        font-weight: 900;
      }

      h1 {
        margin: 0 0 12px;
        text-align: center;
        font-size: clamp(1.8rem, 5vw, 2.3rem);
      }

      .subtitle {
        text-align: center;
        margin: 0 0 22px;
        color: var(--muted);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border-radius: 12px;
        border: 1px solid rgba(18,18,18,0.12);
        background: #fafafa;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(241,196,15,0.25);
        border-color: rgba(241,196,15,0.7);
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 999px;
        background: var(--yellow);
        color: var(--ink);
        font-weight: 800;
        padding: 14px 16px;
        cursor: pointer;
        box-shadow: 0 16px 24px rgba(241,196,15,0.25);
      }

      .secondary-link {
        display: block;
        text-align: center;
        margin-top: 14px;
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
      }

      .error {
        display: none;
        background: #fff1f1;
        border: 1px solid #f4c4c4;
        color: #8a1f1f;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 16px;
      }

      .error.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="brand" aria-label="EQUILIBRA admin">
          <span class="brand-mark">E</span>
          <span>EQUILIBRA</span>
        </div>

        <h1>Acceso</h1>
        <p class="subtitle">Ingresa tu contraseña para ver las citas agendadas.</p>

        <div id="errorMessage" class="error">Contraseña incorrecta. Intenta de nuevo.</div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminPassword">Contraseña</label>
            <input id="adminPassword" type="password" placeholder="••••••••" required />
          </div>
          <button class="btn" type="submit">Entrar</button>
        </form>

        <a class="secondary-link" href="index.html">Volver al inicio</a>
      </div>
    </div>

    <script>
      const adminLoginForm = document.getElementById('adminLoginForm');
      const passwordInput = document.getElementById('adminPassword');
      const errorMessage = document.getElementById('errorMessage');

      if (localStorage.getItem('equilibra_admin_token')) {
        window.location.href = 'admin.html';
      }

      adminLoginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = 'admin';
        const password = passwordInput.value.trim();

        try {
          const response = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Credenciales inválidas');
          }

          localStorage.setItem('equilibra_admin_token', data.token);
          window.location.href = 'admin.html';
        } catch (error) {
          errorMessage.textContent = error.message || 'Contraseña incorrecta. Intenta de nuevo.';
          errorMessage.classList.add('show');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });
    </script>
  </body>
</html>
