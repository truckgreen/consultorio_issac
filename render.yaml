# render.yaml - Configuración automática de Despliegue en Render para Equilibra
services:
  - type: web
    name: equilibra-web-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
